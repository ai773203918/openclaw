name: 构建并推送 OpenClaw 镜像 (多架构)

on:
  # 每天 UTC 时间 04:00 运行
  schedule:
    - cron: '0 4 * * *'

  # 允许手动触发 (无需输入参数，直接构建最新版)
  workflow_dispatch:

env:
  REGISTRY_DOCKERHUB: docker.io
  REGISTRY_GHCR: ghcr.io
  # 替换为你的 Docker Hub 用户名
  IMAGE_NAME_DOCKERHUB: ${{ secrets.DOCKER_USERNAME }}/openclaw
  IMAGE_NAME_GHCR: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 需要写权限来创建 Git 标签和推送到 GHCR
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: 检出存储库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取所有历史记录，用于检查标签

            # ==========================================
      # 步骤 1: 确定版本号 & 检查是否已构建
      # ==========================================
      - name: 确定版本并检查构建状态
        id: check_version
        env:
          # 必须添加这行，否则 gh 命令会报错
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHOULD_BUILD="false"

          # 无论是定时还是手动，逻辑统一：获取最新 Release
          echo "Fetching latest release from openclaw/openclaw..."

          # 获取 openclaw/openclaw 仓库的最新 Release 标题
          # 假设标题格式为 "openclaw 2026.4.1"
          LATEST_RELEASE_JSON=$(gh api repos/openclaw/openclaw/releases/latest)
          VERSION=$(echo "$LATEST_RELEASE_JSON" | jq -r '.name | split(" ")[1]')

          if [ -z "$VERSION" ] || [ "$VERSION" == "null" ]; then
            echo "Error: Could not parse version from release name."
            exit 1
          fi

          echo "Latest version found: ${VERSION}"

          # 如果是手动触发，强制构建=
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            # --- 定时触发模式：检查标签 ---
            if git ls-remote --tags origin | grep -q "refs/tags/v-${VERSION}$"; then
              echo "Version ${VERSION} is already built (tag v-${VERSION} exists). Skipping."
            else
              echo "New version ${VERSION} detected. Starting build."
              SHOULD_BUILD="true"
            fi
          else
            # --- 手动触发模式：忽略检查，直接构建 ---
            echo "Workflow dispatched. Force building version ${VERSION} regardless of existing tags."
            SHOULD_BUILD="true"
          fi

          # 输出变量给后续步骤使用
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "SHOULD_BUILD=${SHOULD_BUILD}" >> $GITHUB_OUTPUT

      # ==========================================
      # 步骤 2: 只有当需要构建时才执行后续步骤
      # ==========================================
      # QEMU 是多架构构建模拟器必不可少的部分
      - name: 设置 QEMU (多架构支持)
        if: steps.check_version.outputs.SHOULD_BUILD == 'true'
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        if: steps.check_version.outputs.SHOULD_BUILD == 'true'
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        if: steps.check_version.outputs.SHOULD_BUILD == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 登录 GitHub Container Registry
        if: steps.check_version.outputs.SHOULD_BUILD == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # 步骤 3: 构建并推送镜像 (多架构)
      # ==========================================
      - name: 提取 Docker 元数据
        if: steps.check_version.outputs.SHOULD_BUILD == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_DOCKERHUB }}/${{ env.IMAGE_NAME_DOCKERHUB }}
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}
          tags: |
            type=raw,value=${{ steps.check_version.outputs.VERSION }}
            type=raw,value=latest,enable=true

      - name: 构建并推送 Docker 镜像
        if: steps.check_version.outputs.SHOULD_BUILD == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 关键：指定多架构平台
          platforms: linux/amd64,linux/arm64
          # 关键：传入版本号给 Dockerfile
          build-args: |
            OPENCLAW_VERSION=${{ steps.check_version.outputs.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 👇 额外保险：确保即使标签存在也覆盖 (虽然 Docker push 默认就是覆盖)
          # 这里不需要额外参数，但确保 push: true 即可

      # ==========================================
      # 步骤 4: 标记 Git 版本 (防止重复构建)
      # ==========================================
      - name: 标记 Git 存储库
        if: steps.check_version.outputs.SHOULD_BUILD == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 👇 关键修改：如果标签已存在，强制更新 (-f)
          git tag -fa "v-${{ steps.check_version.outputs.VERSION }}" -m "Build OpenClaw version ${{ steps.check_version.outputs.VERSION }}"
          # 推送标签时也使用 --force
          git push origin "v-${{ steps.check_version.outputs.VERSION }}" --force